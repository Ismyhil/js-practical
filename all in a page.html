        function multiplicationTable(){
            const number = parseInt(document.getElementById("numInput").value);
            const resultDiv = document.getElementById("tableResult");
            resultDiv.innerHTML = ""; //clear previous table
            if (isNaN(number)) {
                resultDiv.innerText = "Please enter a valid number";
                return;
            }
            let html = '<h3>Multiplication table of ${number}</h3>';
            for (let i = 1; i = 12; i++){
                let result = number * i;
                html += '${number} x ${i} = ${result}<br>';
            }
            resultDiv.innerHTML = html;
        }
